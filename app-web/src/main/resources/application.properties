spring.application.name=catalogo-videojuegos
server.port=${PORT:8080}

# Versión y entorno: el pipeline los inyecta como variables de entorno al desplegar.
# En desarrollo (local) quedan como "dev" / "desarrollo".
app.version=${APP_VERSION:dev}
app.entorno=${APP_ENV:desarrollo}

# Persistencia: H2 en archivo. En producción (Docker) DATA_DIR=/data, montado en un volumen.
spring.datasource.url=jdbc:h2:file:${DATA_DIR:./data}/catalogo;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Health check que usa el pipeline después de desplegar
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
